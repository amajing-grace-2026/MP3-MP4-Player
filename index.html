<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar MP3 & MP4 Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .player-card { background-color: #1e1e1e; width: 100%; max-width: 700px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .media-container { width: 100%; background: #000; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; max-height: 400px; }
    .playlist-section { padding: 20px; }
    
    .nav-controls { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .nav-btn { background-color: #2a2a2a; color: white; border: 1px solid #444; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s; }
    .nav-btn:hover { background-color: #333; border-color: #666; }
    .nav-btn.active { background-color: #1db954; border-color: #1db954; color: black; }
    
    .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .file-input-btn { display: inline-block; background-color: #1db954; color: white; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; text-align: center; font-size: 14px; }
    .file-input-btn:hover { background-color: #1ed760; }
    .clear-btn { background-color: #e91e63; color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .clear-btn:hover { background-color: #f44336; }
    input[type="file"] { display: none; }
    ul.playlist { list-style: none; max-height: 250px; overflow-y: auto; border: 1px solid #333; border-radius: 8px; }
    ul.playlist li { padding: 12px 15px; border-bottom: 1px solid #282828; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    ul.playlist li:last-child { border-bottom: none; }
    ul.playlist li:hover { background-color: #282828; }
    ul.playlist li.active { background-color: #2a2a2a; color: #1db954; font-weight: bold; }
    .track-title { cursor: pointer; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
    .remove-btn { background: none; border: none; color: #888; font-size: 16px; cursor: pointer; padding: 2px 6px; }
    .remove-btn:hover { color: #ff5252; }
  </style>
</head>
<body>

<div class="player-card">
  <div class="media-container">
    <video id="mediaPlayer" controls></video>
  </div>
  
  <div class="playlist-section">
    <!-- Kontrol Navigasi, Shuffle & Repeat -->
    <div class="nav-controls">
      <button class="nav-btn" id="shuffleBtn">🔀 Shuffle: OFF</button>
      <button class="nav-btn" id="prevBtn">⏮ Prev</button>
      <button class="nav-btn" id="nextBtn">Next ⏭</button>
      <button class="nav-btn" id="repeatBtn">🔁 Repeat: OFF</button>
    </div>

    <div class="controls-bar">
      <label class="file-input-btn">
        + Tambah File (MP3 / MP4)
        <input type="file" id="filePicker" accept=".mp3, .mp4, audio/*, video/*" multiple>
      </label>
      <button class="clear-btn" id="clearBtn">Kosongkan Daftar</button>
    </div>

    <ul class="playlist" id="playlist">
      <li style="text-align: center; color: #888; justify-content: center;">Belum ada media yang ditambahkan.</li>
    </ul>
  </div>
</div>

<script>
  const filePicker = document.getElementById('filePicker');
  const playlistUI = document.getElementById('playlist');
  const mediaPlayer = document.getElementById('mediaPlayer');
  const clearBtn = document.getElementById('clearBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  
  let trackList = [];
  let currentIndex = -1;
  let currentObjectUrl = null;

  // Konfigurasi Shuffle & Repeat
  let isShuffle = false;
  const repeatModes = ['off', 'all', 'one']; // Modes: Off -> Repeat All -> Repeat One
  let repeatIndex = 0;

  // Toggle Mode Shuffle
  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    if (isShuffle) {
      shuffleBtn.classList.add('active');
      shuffleBtn.textContent = '🔀 Shuffle: ON';
    } else {
      shuffleBtn.classList.remove('active');
      shuffleBtn.textContent = '🔀 Shuffle: OFF';
    }
  });

  // Toggle Mode Repeat (3 Mode: OFF, ALL, ONE)
  repeatBtn.addEventListener('click', () => {
    repeatIndex = (repeatIndex + 1) % repeatModes.length;
    const mode = repeatModes[repeatIndex];
    
    if (mode === 'off') {
      repeatBtn.classList.remove('active');
      repeatBtn.textContent = '🔁 Repeat: OFF';
    } else if (mode === 'all') {
      repeatBtn.classList.add('active');
      repeatBtn.textContent = '🔁 Repeat: ALL';
    } else if (mode === 'one') {
      repeatBtn.classList.add('active');
      repeatBtn.textContent = '🔂 Repeat: ONE';
    }
  });

  filePicker.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    const isFirstTime = trackList.length === 0;
    trackList = trackList.concat(files);
    filePicker.value = '';

    renderPlaylist();

    if (isFirstTime) {
      playTrack(0);
    }
  });

  function renderPlaylist() {
    playlistUI.innerHTML = '';
    
    if (trackList.length === 0) {
      playlistUI.innerHTML = '<li style="text-align: center; color: #888; justify-content: center;">Belum ada media yang ditambahkan.</li>';
      return;
    }

    trackList.forEach((file, index) => {
      const li = document.createElement('li');
      if (index === currentIndex) li.classList.add('active');

      const titleSpan = document.createElement('span');
      titleSpan.className = 'track-title';
      titleSpan.textContent = `${index + 1}. ${file.name}`;
      titleSpan.onclick = () => playTrack(index);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.innerHTML = '&#10005;';
      removeBtn.title = 'Hapus dari daftar';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        removeTrack(index);
      };

      li.appendChild(titleSpan);
      li.appendChild(removeBtn);
      playlistUI.appendChild(li);
    });
  }

  function playTrack(index) {
    if (index < 0 || index >= trackList.length) return;
    
    currentIndex = index;
    const file = trackList[currentIndex];

    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
    }

    currentObjectUrl = URL.createObjectURL(file);
    mediaPlayer.src = currentObjectUrl;
    mediaPlayer.load();

    const playPromise = mediaPlayer.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {});
    }

    renderPlaylist();
  }

  function getNextIndex() {
    if (trackList.length === 0) return -1;

    // Jika mode Shuffle aktif
    if (isShuffle) {
      if (trackList.length === 1) return 0;
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * trackList.length);
      } while (randomIndex === currentIndex && trackList.length > 1);
      return randomIndex;
    }
    
    let nextIndex = currentIndex + 1;
    if (nextIndex >= trackList.length) {
      const mode = repeatModes[repeatIndex];
      if (mode === 'off') return -1;
      return 0; // Mengulang dari awal jika mode 'ALL'
    }
    return nextIndex;
  }

  function getPrevIndex() {
    if (trackList.length === 0) return -1;

    if (isShuffle) {
      if (trackList.length === 1) return 0;
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * trackList.length);
      } while (randomIndex === currentIndex && trackList.length > 1);
      return randomIndex;
    }

    let prevIndex = currentIndex - 1;
    if (prevIndex < 0) {
      prevIndex = trackList.length - 1;
    }
    return prevIndex;
  }

  prevBtn.addEventListener('click', () => {
    const idx = getPrevIndex();
    if (idx !== -1) playTrack(idx);
  });

  nextBtn.addEventListener('click', () => {
    const idx = getNextIndex();
    if (idx !== -1) playTrack(idx);
  });

  function removeTrack(index) {
    trackList.splice(index, 1);
    
    if (trackList.length === 0) {
      currentIndex = -1;
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      mediaPlayer.removeAttribute('src');
      mediaPlayer.load();
    } else if (index === currentIndex) {
      const nextIdx = getNextIndex();
      if (nextIdx !== -1) {
        playTrack(nextIdx);
      } else {
        currentIndex = -1;
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        mediaPlayer.removeAttribute('src');
        mediaPlayer.load();
      }
    } else if (index < currentIndex) {
      currentIndex--;
    }
    
    renderPlaylist();
  }

  clearBtn.addEventListener('click', () => {
    trackList = [];
    currentIndex = -1;
    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    mediaPlayer.removeAttribute('src');
    mediaPlayer.load();
    renderPlaylist();
  });

  // Logika pemutaran otomatis saat berkas selesai diputar
  mediaPlayer.addEventListener('ended', () => {
    const mode = repeatModes[repeatIndex];
    
    // Jika mode Repeat ONE aktif, ulang lagu yang sama
    if (mode === 'one') {
      playTrack(currentIndex);
      return;
    }

    const nextIndex = getNextIndex();
    if (nextIndex !== -1) {
      playTrack(nextIndex);
    }
  });
</script>

</body>
</html>
